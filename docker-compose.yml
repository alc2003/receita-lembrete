services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/receita_lembrete.db
      - FRONTEND_ORIGIN=http://localhost:5173
      - GOOGLE_REDIRECT_URI=http://localhost:8000/auth/google/callback
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/app:/app/app
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend

volumes:
  backend_data:
